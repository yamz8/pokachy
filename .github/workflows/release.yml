name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Resolve the companion repository before doing release work so a
      # missing repository or token cannot leave only half the bundle updated.
      - uses: actions/checkout@v4
        with:
          repository: yamz8/pokachy-omarchy
          token: ${{ secrets.OMARCHY_PLUGIN_TOKEN }}
          path: omarchy-plugin-repository
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - run: scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/install.sh dist/SHA256SUMS --generate-notes --draft
      - name: Publish matching Omarchy plugin
        working-directory: omarchy-plugin-repository
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git rm -r --ignore-unmatch .
          cp -R ../dist/pokachy-omarchy/. .
          git add --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin HEAD:main "$RELEASE_TAG"
      - name: Publish release after companion plugin succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
